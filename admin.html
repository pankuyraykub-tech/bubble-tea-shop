<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubble Tea | ระบบหลังร้าน</title><style>body{margin:0;background:#fffaf5;color:#35241f;font-family:system-ui,sans-serif}.top{background:#35241f;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:30px 5%}.login,.order{background:white;border:1px solid #f0e6e0;border-radius:18px;padding:20px;margin:15px 0}.field{padding:12px;border:1px solid #ddd;border-radius:10px;width:min(350px,100%);margin:5px 0}button{padding:10px 15px;border:0;border-radius:10px;background:#b75c75;color:white;cursor:pointer}select{padding:10px;border:1px solid #ddd;border-radius:10px;margin:5px}small{color:#8c7770}.line{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.error{color:#b42318}</style></head><body><header class="top"><b>🧋 Bubble Tea · ระบบหลังร้าน</b><a href="/" style="color:white">กลับหน้าเว็บลูกค้า</a></header><main class="wrap"><h1>รายการออเดอร์</h1><section class="login"><label>รหัสผู้ดูแลระบบ</label><br><input class="field" type="password" id="key" placeholder="ใส่รหัสผู้ดูแล"><button onclick="loadOrders()">เข้าสู่ระบบ / โหลดออเดอร์</button><p><small>ค่าเริ่มต้นตอนทดลอง: bubble-admin-1234 · ควรเปลี่ยน ADMIN_KEY ก่อนเปิดใช้งานจริง</small></p><p id="msg" class="error"></p></section><div id="orders"></div></main><script>
const statuses=['รอรับออเดอร์','กำลังทำ','พร้อมรับ/จัดส่ง','สำเร็จ','ยกเลิก'];async function loadOrders(){let key=document.getElementById('key').value;try{let r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});let data=await r.json();if(!r.ok)throw Error(data.error);document.getElementById('msg').textContent='โหลด '+data.length+' ออเดอร์';document.getElementById('orders').innerHTML=data.map(o=>`<article class="order"><div class="line"><h2>${o.id}</h2><b>${o.status}</b><small>${new Date(o.createdAt).toLocaleString('th-TH')}</small></div><p><b>${esc(o.customer)}</b> · ${esc(o.phone)} · ${esc(o.fulfillment)}</p><p>${esc(o.address)}</p>${o.items.map(i=>`<p>• ${esc(i.name)} ×${i.qty} (${i.size}, หวาน ${esc(i.sugar)}, น้ำแข็ง ${esc(i.ice)}) ${i.toppings.length?'· '+i.toppings.map(t=>esc(t)).join(', '):''} — ฿${i.lineTotal}</p>`).join('')}<p><b>รวม ฿${o.total}</b>${o.note?' · หมายเหตุ: '+esc(o.note):''}</p><div class="line"><select id="s-${o.id}">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="updateStatus('${o.id}')">อัปเดตสถานะ</button></div></article>`).join('')||'<p>ยังไม่มีออเดอร์</p>'}catch(e){document.getElementById('msg').textContent=e.message;document.getElementById('orders').innerHTML=''}}async function updateStatus(id){let key=document.getElementById('key').value,status=document.getElementById('s-'+id).value;let r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({status})});let j=await r.json();if(!r.ok){alert(j.error);return}loadOrders()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
